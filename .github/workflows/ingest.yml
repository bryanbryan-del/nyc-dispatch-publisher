# 아침 카드 반입: 클라우드 아침 작업이 Drive uploads/<날짜>/에 올린 카드+manifest를
# 서비스 계정으로 내려받아 posts/<날짜>/로 커밋한다 (JPEG 변환·8MB 처리 포함).
# 클라우드 세션은 GitHub API에 직접 못 쓰기 때문에 Drive를 경유한다.
name: ingest
on:
  schedule:
    - cron: "15,40 11,12 * * *" # 7:15/7:40 ET (EDT+EST 커버, 스크립트가 ET 창 판단)
  workflow_dispatch:
    inputs:
      force:
        description: "이미 있어도 덮어쓰기"
        type: boolean
        default: false

concurrency:
  group: pipeline-state

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull cards from Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FORCE_INGEST: ${{ inputs.force == true && '1' || '' }}
        run: python scripts/ingest.py
      - name: Commit posts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts state
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "cards $(TZ=America/New_York date +%F) (drive ingest)"
          git pull --rebase origin main
          git push origin main
