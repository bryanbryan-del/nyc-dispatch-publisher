# 승인된 슬롯만 게시: 먼저 텔레그램 승인(버튼/명령)을 수집하고, publisher가
# approvals[slot] is True 인 경우에만 Instagram Graph API로 캐러셀을 올린다.
# cron은 UTC로 EDT/EST를 모두 커버하고, 스크립트가 ET 시각(8/12/18시)으로 슬롯을 정한다.
name: publish
on:
  schedule:
    - cron: "30 0,1,14,15,16,17,19,20,22,23 * * *" # 10:30/12:30/15:30/18:30/20:30 ET (EDT+EST 커버)
  workflow_dispatch:
    inputs:
      slot:
        description: "슬롯"
        type: choice
        options: [free, food, art, gem, art, night]
        required: true
      dry_run:
        description: "dry run (실제 게시 안 함)"
        type: boolean
        default: false

concurrency:
  group: pipeline-state

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect Telegram approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/approvals.py
      - name: Publish approved slot
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publisher.py --slot "${{ inputs.slot }}" ${{ inputs.dry_run == true && '--dry-run' || '' }}
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "state: publish $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push origin main
