# 승인 수거 + 즉시 확인 답장: ET 낮 시간대에 10분마다 텔레그램 승인(버튼/명령)을
# 수거해 state 에 기록한다. 변경이 있으면 approvals.py 가 "승인 상태 변경: ✅ ..."
# 확인 메시지를 보내므로, Bryan 은 승인 후 늦어도 10분 안에 답장을 받는다.
# (기존에는 게시 시각에만 수거해서 승인이 눌렸는지 알 길이 없었다)
name: approvals
on:
  schedule:
    - cron: "*/10 11-23,0-2 * * *" # ET 낮~밤 (EDT 7:00-22:50 / EST 6:00-21:50 커버)
  workflow_dispatch: {}

concurrency:
  group: pipeline-state

permissions:
  contents: write
  actions: write # cron 미발화 시 render 워크플로를 깨우기 위함

jobs:
  approvals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect Telegram approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/approvals.py
      # cron 지연/미발화 대비: 슬롯 시각이 지났는데 승인된 채로 안 올라간 것을
      # 여기서 따라잡는다. 한 번에 하나만 올리므로 10분 간격으로 순차 게시된다.
      - name: Publish overdue approved slots
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publisher.py --catchup

      # 아침 render cron 이 아예 안 도는 날이 있다. 오늘 카드가 없으면 한 번 깨운다.
      # (Drive 에 spec 이 아직 없으면 render 가 알아서 조용히 건너뛴다)
      - name: Kick render if today's cards are missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "scripts")
          from common import ROOT, load_state, save_state, now_et, today_et
          date, n = today_et(), now_et()
          if (ROOT / "posts" / date / "manifest.json").exists():
              print("오늘 카드 있음 - 할 일 없음"); raise SystemExit(0)
          if not ((n.hour == 7 and n.minute >= 20) or (8 <= n.hour < 10)):
              print(f"render 재시도 창(ET 7:20-10:00) 밖 - 지금 {n:%H:%M}"); raise SystemExit(0)
          st = load_state(date)
          if st.get("render_kicked"):
              print("오늘 이미 render 를 깨웠음"); raise SystemExit(0)
          subprocess.run(["gh", "workflow", "run", "render.yml", "--ref", "main"], check=True)
          st["render_kicked"] = True
          save_state(date, st)
          print("render 워크플로 발동함")
          PY

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "state: approvals $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push origin main
