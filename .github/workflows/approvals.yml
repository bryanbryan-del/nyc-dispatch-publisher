# 승인 수거 + 즉시 확인 답장: ET 낮 시간대에 10분마다 텔레그램 승인(버튼/명령)을
# 수거해 state 에 기록한다. 변경이 있으면 approvals.py 가 "승인 상태 변경: ✅ ..."
# 확인 메시지를 보내므로, Bryan 은 승인 후 늦어도 10분 안에 답장을 받는다.
# (기존에는 게시 시각에만 수거해서 승인이 눌렸는지 알 길이 없었다)
name: approvals
on:
  schedule:
    - cron: "*/10 11-23,0-2 * * *" # ET 낮~밤 (EDT 7:00-22:50 / EST 6:00-21:50 커버)
  workflow_dispatch: {}

concurrency:
  group: pipeline-state

permissions:
  contents: write

jobs:
  approvals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect Telegram approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/approvals.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "state: approvals $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push origin main
